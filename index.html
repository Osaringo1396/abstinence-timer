<style>

.shbox{width:100%;max-width:480px;max-height:88vh;overflow:auto;background:#12141a;border:1px solid var(--gold);border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}

.pe2{font-size:140px;line-height:1.2;animation:bob 2.4s ease-in-out infinite}

#nbtn,#nok,#nno{flex:none;padding:6px 12px;font-size:12px;letter-spacing:0;background:transparent;border:1px solid var(--line);color:var(--gold);border-radius:8px}

#cfg.on{display:flex;animation:fade .25s}

body[data-bg="1"]{background:radial-gradient(ellipse 90% 45% at 50% 100%,rgba(255,170,90,.55),transparent 70%),linear-gradient(180deg,#141a33,#4a2d4e 60%,#8a4a3a);background-attachment:fixed}

  if(!window._sil){const n=800,b=new Uint8Array(44+n),d=new DataView(b.buffer),w=(o,s)=>[...s].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
    w(0,'RIFF');d.setUint32(4,36+n,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,'data');d.setUint32(40,n,true);b.fill(128,44);
    const a=new Audio('data:audio/wav;base64,'+btoa(String.fromCharCode(...b)));a.loop=true;a.volume=.01;window._sil=a}
  window._sil.play().catch(()=>{})}catch(e){}}
const BGMS=[
{n:'静寂の誓い',u:0,bar:8,v:1,pw:'triangle',aw:'triangle',ch:[[110,220,261.6,329.6],[87.3,174.6,220,261.6],[130.8,261.6,329.6,392],[98,196,246.9,293.7]],ar:[440,523.3,587.3,659.3,784,880],pt:[0,2,4,2,3,5,3,1]},
{n:'朝焼けの行進',u:3,bar:6,v:1,pw:'triangle',aw:'triangle',ch:[[130.8,261.6,329.6,392],[98,196,246.9,293.7],[110,220,261.6,329.6],[87.3,174.6,220,261.6]],ar:[523.3,587.3,659.3,784,880,1046.5],pt:[0,2,1,3,2,4,3,5]},
{n:'鋼の鼓動',u:6,bar:6,v:.7,pw:'sawtooth',aw:'square',ch:[[73.4,146.8,174.6,220],[58.3,116.5,146.8,174.6],[87.3,174.6,220,261.6],[65.4,130.8,164.8,196]],ar:[293.7,349.2,392,440,523.3,587.3],pt:[0,0,2,0,3,0,4,2]},
{n:'星降る夜',u:9,bar:8,v:1,pw:'sine',aw:'sine',ch:[[82.4,164.8,196,246.9],[65.4,130.8,164.8,196],[98,196,246.9,293.7],[73.4,146.8,185,220]],ar:[659.3,784,987.8,1174.7,1318.5,1568],pt:[0,3,1,4,2,5,3,1]},
{n:'覇者の凱歌',u:13,bar:6,v:.8,pw:'sawtooth',aw:'triangle',ch:[[110,220,261.6,329.6],[98,196,246.9,293.7],[87.3,174.6,220,261.6],[82.4,164.8,207.7,246.9]],ar:[440,523.3,659.3,784,880,1046.5],pt:[0,2,3,5,4,3,2,1]},
{n:'天空の神殿',u:17,bar:10,v:1,pw:'sine',aw:'triangle',ch:[[87.3,174.6,220,329.6],[130.8,261.6,329.6,493.9],[98,196,293.7,392],[110,220,329.6,392]],ar:[523.3,659.3,784,987.8,1046.5,1318.5],pt:[0,1,2,3,4,5,4,2]},
{n:'宇宙の彼方',u:21,bar:12,v:1,pw:'sine',aw:'sine',ch:[[55,110,164.8,220],[43.7,87.3,130.8,196],[65.4,130.8,196,261.6],[49,98,146.8,220]],ar:[329.6,493.9,659.3,880,987.8,1318.5],pt:[0,2,5,3,1,4,2,0]}];
function bgmStart(){const a=ac();if(!a){say('この端末では音を鳴らせません');return}if(bgm)return;unlockAudio();const T=BGMS[DEV.bgm]||BGMS[0],m=a.createGain(),st=T.bar/8;
  m.gain.setValueAtTime(0,a.currentTime);m.gain.linearRampToValueAtTime(.35*T.v*DEV.vol/50,a.currentTime+2);m.connect(a.destination);
  let c=0;const bar=()=>{const t=a.currentTime+.05,ch=T.ch[c%4],B=T.bar;
    ch.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),v=i?.3:.4;o.type=i?T.pw:'sine';o.frequency.value=i?f:f*2;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+B*.25);g.gain.setValueAtTime(v,t+B*.75);g.gain.linearRampToValueAtTime(0,t+B+.4);
      o.connect(g);g.connect(m);o.start(t);o.stop(t+B+.5)});
    T.pt.forEach((k,i)=>{const o=a.createOscillator(),g=a.createGain(),s=t+i*st;o.type=T.aw;o.frequency.value=T.ar[(k+c%3)%6];
      g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.3,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+st*.95);
      o.connect(g);g.connect(m);o.start(s);o.stop(s+st)});c++};
  bgm={m,T,iv:setInterval(bar,T.bar*1000)};bar()}
function bgmStop(){if(!bgm)return;const a=AC,{m,iv}=bgm;clearInterval(iv);m.gain.cancelScheduledValues(a.currentTime);m.gain.setValueAtTime(m.gain.value,a.currentTime);m.gain.linearRampToValueAtTime(0,a.currentTime+.6);setTimeout(()=>{try{m.disconnect()}catch(e){}},800);bgm=null}
document.addEventListener("pointerdown",()=>{if(bgmWant&&!bgm)bgmStart()});

/* helpers */
function fmt(ms){const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=v=>String(v).padStart(2,"0");return d+"日 "+p(h)+":"+p(m)+":"+p(x)}
function rq(t){return t>=2*D?(t/D)+"日目":(t/H)+"時間"}
function elapsed(){return S.start?Date.now()-S.start:0}
const cnt=ms=>TITLES.filter(t=>ms>=t.t).length;
function tierOf(n){return n<=3?"a":n<=8?"b":n<=13?"c":n<=18?"d":"e"}

/* effects */
function confetti(n){const cs=["#ffd76a","#ff5a64","#6ee7ff","#c77dff","#fff"];
  for(let i=0;i<n;i++){const s=document.createElement("span");s.className="pt";s.style.left=Math.random()*100+"vw";
    const z=6+Math.random()*8;s.style.width=z+"px";s.style.height=z*1.6+"px";s.style.background=cs[i%cs.length];
    s.style.animationDuration=(2+Math.random()*2.5)+"s";s.style.animationDelay=Math.random()*.8+"s";
    document.body.appendChild(s);setTimeout(()=>s.remove(),5500)}}
let queue=[],showing=false;
function showNext(){if(showing||!queue.length)return;showing=true;const t=queue.shift(),idx=TITLES.indexOf(t)+1;
  $("ovI").textContent=t.i;$("ovN").textContent=nm(t);$("ovR").textContent=rq(t.t)+"に到達";
  $("ov").classList.add("on");confetti(Math.min(160,40+idx*8));snd.fanfare(idx)}
$("ov").onclick=()=>{$("ov").classList.remove("on");showing=false;setTimeout(showNext,250)};
let emb=false;
function embers(on){if(on===emb)return;emb=on;document.querySelectorAll(".em").forEach(e=>e.remove());
  if(!on)return;for(let i=0;i<16;i++){const s=document.createElement("span");s.className="em";s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(6+Math.random()*8)+"s";s.style.animationDelay=(-Math.random()*10)+"s";document.body.appendChild(s)}}

/* render */
function checkUnlocks(top){const n=cnt(top);
  if(n>S.seen){for(let i=S.seen;i<n;i++)queue.push(TITLES[i]);S.seen=n;persist();showNext()}}
function render(){
  const e=elapsed(),run=!!S.start,top=Math.max(e,S.best),n=cnt(top),ne=cnt(e);
  $("time").textContent=fmt(e);$("best").textContent=fmt(top);
  $("start").disabled=run;$("stop").disabled=!run;
  $("state").textContent=run?"継続中":"スタートを押して開始";
  const tier=tierOf(n);document.body.dataset.tier=tier;embers(tier==="d"||tier==="e");
  const cur=ne?TITLES[ne-1]:null;
  $("rank").textContent=run?(cur?nm(cur):"称号：？？？？？"):"未開始";
  $("crest").textContent=TITLES.slice(0,n).map(t=>t.i).join("");
  const nx=TITLES.find(t=>e<t.t);
  if(nx&&run){const prev=cur?cur.t:0;$("fill").style.width=Math.min(100,(e-prev)/(nx.t-prev)*100)+"%";$("next").textContent="次の称号（"+rq(nx.t)+"）まで "+fmt(nx.t-e)}
  else{$("fill").style.width=run?"100%":"0%";$("next").textContent=run?"すべての称号を獲得しました":""}
  $("list").innerHTML=TITLES.map(t=>top>=t.t
    ?'<li class="got"><span class="ic">'+t.i+'</span><span class="nm">'+esc(nm(t))+'</span><span class="rq">'+rq(t.t)+'</span></li>'
    :'<li class="lock"><span class="ic">🔒</span><span class="nm">？？？？？</span><span class="rq">'+rq(t.t)+'</span></li>').join("");
  $("mute").textContent=S.mute?"🔇":"🔊";$("bgm").textContent=bgmWant?"🎵 ON":"🎵 OFF";$("h1").textContent=(S.goal||"禁欲")+"タイマー ✏";document.title=(S.goal||"禁欲")+"タイマー";$("miniT").textContent=fmt(e);$("miniR").textContent=$("rank").textContent;petUI();unlockCheck();
  checkUnlocks(top);
}

/* actions */
$("start").onclick=()=>{ac();snd.start();S.start=Date.now();persist();render()};
function confirmSteps(btn,label,steps,ms,fn){let k=0,tm;const reset=()=>{k=0;btn.textContent=label};btn.onclick=()=>{
  clearTimeout(tm);if(k<steps.length){btn.textContent=steps[k++];snd.warn();tm=setTimeout(reset,ms);return}reset();fn()};
  document.addEventListener("pointerdown",e=>{if(k&&!btn.contains(e.target)){clearTimeout(tm);reset()}})}
confirmSteps($("stop"),"ストップ",["本当に停止する？","努力が途切れるぞ？","最終確認：停止する"],10000,()=>{snd.stop();S.bank+=10*Math.floor(elapsed()/H);S.best=Math.max(S.best,elapsed());S.start=null;persist();render()});
confirmSteps($("resetbest"),"最長記録をリセット",["本当にリセット？もう一度"],8000,()=>{S.best=0;S.seen=cnt(elapsed());persist();render()});
$("bgm").onclick=()=>{bgmWant=!bgmWant;try{localStorage.setItem("abst-bgm",bgmWant?"1":"0")}catch(e){}bgmWant?bgmStart():bgmStop();render()};
$("mute").onclick=()=>{S.mute=!S.mute;save();render();if(!S.mute)snd.click()};
function rot(id,arr,ms){const el=$(id);let i=Math.floor(Math.random()*arr.length);const f=()=>{el.style.opacity=0;setTimeout(()=>{el.textContent=arr[i++%arr.length];el.style.opacity=1},500)};f();setInterval(f,ms)}
applyDev();setTimeout(maybeSetup,2500);rot("motto",MOTTOS,8000);rot("urge",URGES,10000);
render();setInterval(render,1000);
(async()=>{try{
  if(typeof claude==="undefined"||!claude.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  DOC=db.doc("data/users/"+id+"/timer");
  const snap=await DOC.get();const r=snap.exists?snap.data():null;
  if(r&&(+r.updatedAt||0)>S.updatedAt)apply(r);else if(S.updatedAt)push();
  setSync("ok");maybeSetup();
  DOC.onSnapshot(s=>{if(s.exists){const d=s.data();if((+d.updatedAt||0)>S.updatedAt)apply(d)}});
}catch(e){DOC=null;setSync("local")}})();
